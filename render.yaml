services:
  - type: web
    name: boostx-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # preDeployCommand is a paid-plan-only feature — Render silently never
    # runs it on a free-tier web service, which is why the database never
    # got its tables. Running the (idempotent) migration here instead means
    # it runs on every boot; safe on free or paid plans either way.
    dockerCommand: "flask db upgrade && flask seed && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 'backend.app:create_app()'"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: boostx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: boostx-redis
          property: connectionString
      - key: PROVIDER_MODE
        value: live
      - key: PROVIDER_API_URL
        value: https://baloonboost.com/api/v2
      - key: PROVIDER_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      # Switched from OpenAI to Gemini: Flash-Lite is free (rate limited —
      # check your current quota in Google AI Studio), and the "-latest"
      # alias is a rolling pointer Google maintains, so this never hardcodes
      # a dated model id that gets deprecated out from under us. AI_API_KEY
      # above must hold a Google AI Studio key, not an OpenAI key.
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-flash-lite-latest

  - type: worker
    name: boostx-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "python -m backend.app.workers.scheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boostx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: boostx-redis
          property: connectionString
      - key: PROVIDER_MODE
        value: live
      - key: PROVIDER_API_URL
        value: https://baloonboost.com/api/v2
      - key: PROVIDER_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      # Switched from OpenAI to Gemini: Flash-Lite is free (rate limited —
      # check your current quota in Google AI Studio), and the "-latest"
      # alias is a rolling pointer Google maintains, so this never hardcodes
      # a dated model id that gets deprecated out from under us. AI_API_KEY
      # above must hold a Google AI Studio key, not an OpenAI key.
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-flash-lite-latest

  - type: redis
    name: boostx-redis
    ipAllowList: []
    plan: free

databases:
  - name: boostx-db
    databaseName: boostx_db
    user: boostx
    plan: free
